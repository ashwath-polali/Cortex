<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>Cortex</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background-color: #f0f1f3;
  background-image: linear-gradient(145deg, #ffffff 0%, #f0f1f3 50%, #e8eaed 100%);
  overflow: hidden; font-family: 'JetBrains Mono', monospace; color: rgba(0,0,0,0.85);
  transition: background-color 400ms, color 400ms;
}
body.dark {
  background-color: #131316 !important;
  background-image: linear-gradient(145deg, #0d0d0f 0%, #131316 50%, #18181c 100%) !important;
  color: rgba(255,255,255,0.85);
}
canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

.label {
  position: fixed; top: 20px; left: 0; right: 0; text-align: center;
  font-size: 11px; letter-spacing: 0.25em; color: rgba(0,0,0,0.35);
  pointer-events: none; z-index: 10;
}

.logout-btn {
  position: fixed; top: 20px; left: 20px; z-index: 10;
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(0,0,0,0.2); text-decoration: none;
  letter-spacing: 0.05em; transition: color 150ms;
}
.logout-btn:hover { color: rgba(0,0,0,0.5); }

.hide-toggle-wrap {
  position: fixed; bottom: 24px; left: 24px; z-index: 10;
}
.hide-toggle-wrap button {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.6);
  color: rgba(0,0,0,0.25); cursor: pointer; letter-spacing: 0.05em;
  backdrop-filter: blur(8px); transition: color 150ms, border-color 150ms;
}
.hide-toggle-wrap button:hover { color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.2); }
.hide-toggle-wrap button.toggle-on { color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.2); }
.toggle-popover {
  position: fixed; right: 80px; z-index: 101;
  display: flex; gap: 6px; align-items: center;
  opacity: 0; transform: translateX(8px); pointer-events: none;
  transition: opacity 150ms, transform 150ms, right 200ms;
}
.toggle-popover.tp-open { opacity: 1; transform: translateX(0); pointer-events: auto; }
.toggle-popover button {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.08); background: rgba(255,255,255,0.85);
  color: rgba(0,0,0,0.25); cursor: pointer; letter-spacing: 0.05em;
  backdrop-filter: blur(12px); transition: color 150ms, border-color 150ms;
  white-space: nowrap;
}
.toggle-popover button:hover { color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.2); }
.toggle-popover button.toggle-on { color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.2); }

.tooltip {
  position: fixed; z-index: 50; background: rgba(255,255,255,0.95);
  border: 1px solid rgba(0,0,0,0.08); border-radius: 6px;
  padding: 6px 10px; font-size: 11px; color: rgba(0,0,0,0.7);
  max-width: 340px; pointer-events: none; backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  opacity: 0; transition: opacity 120ms;
}
.tooltip.visible { opacity: 1; }
.tooltip .tt-file {
  font-size: 9px; letter-spacing: 0.1em; color: rgba(0,0,0,0.3);
  margin-bottom: 2px; text-transform: uppercase;
}

.action-rail {
  position: fixed; bottom: 24px; right: 24px; z-index: 100;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
  transition: right 200ms;
}
.action-rail.rail-lifted { right: 416px; }
.rail-lifted ~ .rail-expand { right: 472px; }
.rail-lifted ~ .search-results { right: 472px; }
.rail-lifted ~ .toggle-popover { right: 472px; }
.rail-btn {
  width: 44px; height: 44px; border-radius: 50%; background: #fff;
  border: 1px solid rgba(0,0,0,0.1); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: box-shadow 200ms, transform 200ms;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.rail-btn:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.12); }
.rail-btn:active { transform: scale(0.95); }
.rail-btn svg { width: 18px; height: 18px; }
.rail-btn.rail-active { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.18); }

.rail-expand {
  position: fixed; right: 80px; z-index: 101;
  display: flex; align-items: center; gap: 0;
  opacity: 0; transform: translateX(8px); pointer-events: none;
  transition: opacity 180ms, transform 180ms, right 200ms;
}
.rail-expand.rail-open { opacity: 1; transform: translateX(0); pointer-events: auto; }
.rail-expand input {
  width: 240px; padding: 7px 14px; border: 1px solid rgba(0,0,0,0.08);
  border-radius: 999px; background: rgba(255,255,255,0.92); backdrop-filter: blur(16px);
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  color: rgba(0,0,0,0.7); outline: none;
  box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  transition: border-color 200ms, width 200ms;
}
.rail-expand input:focus { border-color: rgba(0,0,0,0.2); width: 300px; }
.rail-expand input::placeholder { color: rgba(0,0,0,0.2); }

.panel {
  position: fixed; bottom: 88px; right: 24px; width: 380px; height: 520px;
  border-radius: 16px; background: #fff; border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 24px 64px rgba(0,0,0,0.1); z-index: 99;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 200ms, transform 200ms;
}
.panel.panel-open { opacity: 1; transform: translateY(0); pointer-events: auto; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.panel-title { font-size: 10px; letter-spacing: 0.2em; color: rgba(0,0,0,0.35); }
.close-btn {
  background: none; border: none; color: rgba(180,60,60,0.5); cursor: pointer;
  font-size: 16px; line-height: 1; transition: color 150ms;
}
.close-btn:hover { color: rgba(180,60,60,0.8); }
.close-btn:active { color: rgba(180,60,60,1); }

.messages {
  flex: 1; overflow-y: auto; padding: 12px 14px; display: flex;
  flex-direction: column; gap: 8px;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

.msg {
  max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 13px;
  line-height: 1.5; word-wrap: break-word;
}
.msg-user { align-self: flex-end; background: #f0f2f5; border: 1px solid rgba(0,0,0,0.06); color: rgba(0,0,0,0.8); }
.msg-ai { align-self: flex-start; background: #f7f8fa; color: rgba(0,0,0,0.75); }
.msg-system { align-self: center; font-size: 11px; color: rgba(0,0,0,0.3); }

.thinking { align-self: flex-start; background: #f7f8fa; padding: 8px 16px; border-radius: 10px; display: flex; gap: 4px; }
.thinking span {
  width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.25);
  animation: pulse 1.4s ease-in-out infinite;
}
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }
@keyframes pulse { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 0.7; } }

.input-area { padding: 8px 14px 14px; }
.pills { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
.compact-toggle {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 3px 8px;
  border-radius: 999px; border: 1px solid rgba(0,0,0,0.08);
  background: transparent; color: rgba(0,0,0,0.25); cursor: pointer;
  margin-left: auto; transition: color 150ms, border-color 150ms;
}
.compact-toggle:hover { color: rgba(0,0,0,0.5); border-color: rgba(0,0,0,0.2); }
.compact-toggle.mode-active { color: rgba(0,0,0,0.6); border-color: rgba(0,0,0,0.25); background: rgba(0,0,0,0.04); }
.mode-group { display: flex; gap: 4px; margin-left: auto; }
.pill {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 4px 10px;
  border-radius: 999px; border: 1px solid rgba(0,0,0,0.1);
  background: transparent; color: rgba(0,0,0,0.45); cursor: pointer;
  transition: color 150ms, border-color 150ms;
}
.pill:hover { color: rgba(0,0,0,0.8); border-color: rgba(0,0,0,0.25); }
.pill:active { color: #000; }

.input-row { display: flex; gap: 8px; }
.input-row input {
  flex: 1; background: #f5f6f8; border: 1px solid rgba(0,0,0,0.08);
  border-radius: 10px; padding: 8px 12px; color: rgba(0,0,0,0.8);
  font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none;
}
.input-row input::placeholder { color: rgba(0,0,0,0.25); }
.input-row input:focus { border-color: rgba(0,0,0,0.2); }
.send-btn {
  background: none; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
  width: 38px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: border-color 150ms;
}
.send-btn:hover { border-color: rgba(0,0,0,0.25); }
.send-btn:active { transform: scale(0.95); }
.send-btn svg { width: 16px; height: 16px; }

.ctx-overlay {
  position: fixed; bottom: 88px; right: 416px; width: 380px; max-height: 70vh; height: 600px;
  border-radius: 16px; background: #fff; border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 24px 64px rgba(0,0,0,0.1); z-index: 98;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 200ms, transform 200ms;
}
.ctx-overlay.panel-open { opacity: 1; transform: translateY(0); pointer-events: auto; }

.ctx-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.ctx-title { font-size: 10px; letter-spacing: 0.2em; color: rgba(0,0,0,0.35); }
.copy-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 3px 8px;
  border-radius: 6px; border: 1px solid rgba(0,0,0,0.1);
  background: transparent; color: rgba(0,0,0,0.4); cursor: pointer;
}
.copy-btn:active { color: #000; }

.ctx-body {
  flex: 1; padding: 12px 14px; min-height: 0;
  position: relative;
}
.ctx-body textarea {
  position: absolute; top: 12px; left: 14px; right: 14px; bottom: 0;
  background: transparent; border: none;
  color: rgba(0,0,0,0.65); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; line-height: 1.6; resize: none; outline: none;
  overflow-y: auto;
}
.ctx-body textarea::-webkit-scrollbar { width: 4px; }
.ctx-body textarea::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 8px 20px; border-radius: 999px; z-index: 200;
  background: #fff; border: 1px solid rgba(0,0,0,0.1);
  color: rgba(0,0,0,0.6); box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  opacity: 0; transition: opacity 200ms, transform 200ms;
  pointer-events: none;
}
.toast.toast-error { color: rgba(180,0,0,0.7); border-color: rgba(180,0,0,0.15); }
.toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }

.editor-overlay {
  position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 200ms;
  backdrop-filter: blur(4px);
}
.editor-overlay.editor-open { opacity: 1; pointer-events: auto; }

.editor-box {
  width: 520px; max-width: 90vw; max-height: 80vh;
  background: #fff; border-radius: 16px; border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 24px 64px rgba(0,0,0,0.12);
  display: flex; flex-direction: column;
  transform: translateY(12px); transition: transform 200ms;
}
.editor-open .editor-box { transform: translateY(0); }

.editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px; border-bottom: 1px solid rgba(0,0,0,0.06);
}
.editor-title { font-size: 10px; letter-spacing: 0.2em; color: rgba(0,0,0,0.35); text-transform: uppercase; }
.editor-actions { display: flex; gap: 8px; align-items: center; }
.editor-save {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 4px 12px;
  border-radius: 999px; border: 1px solid rgba(0,0,0,0.1);
  background: transparent; color: rgba(0,0,0,0.45); cursor: pointer;
}
.editor-save:hover { color: rgba(0,0,0,0.8); border-color: rgba(0,0,0,0.25); }

.editor-body { flex: 1; padding: 12px 14px; overflow: hidden; min-height: 300px; }
.editor-body textarea {
  width: 100%; height: 100%; min-height: 280px; background: transparent; border: none;
  color: rgba(0,0,0,0.75); font-family: 'JetBrains Mono', monospace;
  font-size: 12px; line-height: 1.6; resize: none; outline: none;
}
.editor-box .rich-editor { flex: 1; min-height: 300px; overflow-y: auto; }
.manager-panel .rich-editor { max-height: 400px; }

.search-bar { display: none; }

.search-results {
  position: fixed; right: 80px; z-index: 111;
  width: 300px; max-height: 320px; overflow-y: auto;
  background: rgba(255,255,255,0.97); backdrop-filter: blur(12px);
  border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  display: none;
}
.search-results.sr-open { display: block; }
.sr-item {
  padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(0,0,0,0.04);
}
.sr-item:last-child { border-bottom: none; }
.sr-item:hover { background: rgba(0,0,0,0.03); }
.sr-file { font-size: 9px; letter-spacing: 0.1em; color: rgba(0,0,0,0.3); text-transform: uppercase; margin-bottom: 2px; }
.sr-match { font-size: 11px; color: rgba(0,0,0,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.manager-btn { display: none; }

.manager-panel {
  position: fixed; bottom: 24px; left: 24px; width: 360px; height: 560px;
  border-radius: 16px; background: #fff; border: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 24px 64px rgba(0,0,0,0.1); z-index: 99;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity 200ms, transform 200ms;
}
.manager-panel.panel-open { opacity: 1; transform: translateY(0); pointer-events: auto; }

.mgr-view { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
.mgr-hidden { display: none; }

.cluster-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.cluster-list::-webkit-scrollbar { width: 4px; }
.cluster-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

.cluster-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: default; transition: background 100ms;
}
.cluster-item:hover { background: rgba(0,0,0,0.02); }

.cluster-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1.5px solid rgba(0,0,0,0.12); }
.cluster-name { flex: 1; font-size: 12px; color: rgba(0,0,0,0.7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cluster-count { font-size: 9px; color: rgba(0,0,0,0.25); flex-shrink: 0; }
.cluster-actions { display: flex; gap: 2px; flex-shrink: 0; }
.cluster-actions button {
  background: none; border: none; cursor: pointer; color: rgba(0,0,0,0.2);
  font-size: 14px; padding: 2px 5px; transition: color 100ms;
}
.cluster-actions button:hover { color: rgba(0,0,0,0.6); }
.cluster-actions .del-btn:hover { color: rgba(180,0,0,0.6); }

.color-row {
  display: flex; gap: 6px; padding: 10px 14px; flex-wrap: wrap;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  max-height: 90px; overflow-y: auto;
}
.color-row::-webkit-scrollbar { width: 3px; }
.color-row::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }
.color-swatch {
  width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: border-color 100ms, transform 100ms;
  flex-shrink: 0;
}
.color-swatch:hover { transform: scale(1.15); }
.color-swatch.color-active { border-color: rgba(0,0,0,0.4); }
.color-none {
  width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
  border: 2px solid rgba(0,0,0,0.1); background: #fff; position: relative;
  transition: border-color 100ms, transform 100ms;
  flex-shrink: 0;
}
.color-none:hover { transform: scale(1.15); }
.color-none.color-active { border-color: rgba(0,0,0,0.4); }
.color-none::after {
  content: ''; position: absolute; top: 50%; left: -1px; right: -1px;
  height: 1.5px; background: rgba(0,0,0,0.2); transform: rotate(-45deg);
}

.mgr-view .editor-body { flex: 1; min-height: 0; }
.mgr-view .editor-body textarea { height: 100%; min-height: unset; }

.mgr-input {
  width: 100%; padding: 8px 12px; border: 1px solid rgba(0,0,0,0.08);
  border-radius: 8px; background: #f5f6f8; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: rgba(0,0,0,0.7); outline: none;
}
.mgr-input::placeholder { color: rgba(0,0,0,0.2); }
.mgr-input:focus { border-color: rgba(0,0,0,0.2); }

.confirm-overlay {
  position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.15);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 200ms;
}
.confirm-overlay.confirm-open { opacity: 1; pointer-events: auto; }
.confirm-box {
  background: #fff; border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 16px 48px rgba(0,0,0,0.12); text-align: center; max-width: 300px;
}
.confirm-msg { font-size: 12px; color: rgba(0,0,0,0.6); margin-bottom: 16px; }
.confirm-actions { display: flex; gap: 8px; justify-content: center; }
.confirm-actions button {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 16px;
  border-radius: 999px; cursor: pointer;
}
.confirm-cancel { background: transparent; border: 1px solid rgba(0,0,0,0.1); color: rgba(0,0,0,0.45); }
.confirm-cancel:hover { border-color: rgba(0,0,0,0.25); color: rgba(0,0,0,0.7); }
.confirm-delete { background: transparent; border: 1px solid rgba(180,0,0,0.2); color: rgba(180,0,0,0.6); }
.confirm-delete:hover { border-color: rgba(180,0,0,0.4); color: rgba(180,0,0,0.8); }

.rich-editor { flex: 1; overflow-y: auto; padding: 4px 0; min-height: 0; }
.rich-editor::-webkit-scrollbar { width: 4px; }
.rich-editor::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 2px; }

.re-section {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px 4px; margin-top: 4px;
}
.re-section-text {
  font-size: 10px; letter-spacing: 0.15em; color: rgba(0,0,0,0.3);
  text-transform: uppercase; outline: none; flex: 1; border: none; background: none;
  font-family: 'JetBrains Mono', monospace; padding: 2px 0;
}
.re-section-add {
  font-size: 14px; color: rgba(0,0,0,0.15); cursor: pointer; background: none;
  border: none; padding: 0 4px; transition: color 100ms;
}
.re-section-add:hover { color: rgba(0,0,0,0.4); }

.re-item {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 3px 14px 3px 20px; transition: background 100ms;
}
.re-item:hover { background: rgba(0,0,0,0.02); }
.re-item.re-sub { padding-left: 36px; }
.re-item.re-dragging { opacity: 0.4; }
.re-item.re-drag-over { border-top: 2px solid rgba(0,0,0,0.15); }

.re-grip {
  cursor: grab; color: rgba(0,0,0,0.12); font-size: 10px; padding: 2px 0;
  user-select: none; flex-shrink: 0; line-height: 1.6;
}
.re-grip:hover { color: rgba(0,0,0,0.3); }

.re-imp {
  display: inline-flex; align-items: center; gap: 2px;
  flex-shrink: 0; cursor: pointer; margin-right: 4px; user-select: none;
}
.re-pip { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,0.14); transition: background 100ms; }
.re-pip:hover { background: rgba(60,120,200,0.4); }
.re-pip-on { background: rgba(60,120,200,0.8); }
body.dark .re-pip { background: rgba(255,255,255,0.16); }
body.dark .re-pip-on { background: rgba(95,150,235,0.9); }

.re-source {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 3px;
  font-size: 8px; font-weight: 500; letter-spacing: 0;

<script>
var cv = document.getElementById("c");
var gc = cv.getContext("2d");
var W, H, nodes = [], edges = [];
var tooltip = document.getElementById("tooltip");
var activeNode = null;
var hoverNode = -1;
var mouse = { x: -9999, y: -9999 };
var flashTime = 0;
var brainData = null;
var clusterMeta = [];
var managerOpen = false;
var showLabels = localStorage.getItem("cortex-labels") === "1";
var showColors = localStorage.getItem("cortex-colors") !== "0";
var isDark = localStorage.getItem("cortex-dark") !== "0";
function FC(a) { return isDark ? "rgba(255,255,255," + a + ")" : "rgba(0,0,0," + a + ")"; }
function applyDark(on) {
  isDark = on;
  document.body.classList.toggle("dark", on);
  localStorage.setItem("cortex-dark", on ? "1" : "0");
}
if (isDark) applyDark(true);

function parseTs(text) {
  var m = text.match(/\{\{(\d{4}-\d{2}-\d{2})(?:\|r:(\d{4}-\d{2}-\d{2}))?\}\}/);
  var clean = text.replace(/\s*\{\{[^}]*\}\}/, "").trim();
  return { text: clean, created: m ? m[1] : null, reviewed: m ? (m[2] || null) : null };
}

function parseMeta(text) {
  var m = text.match(/\{\{([^}]+)\}\}/);
  if (!m) return { text: text.trim(), created: null, reviewed: null, importance: 3, tags: [], expiry: null, source: null, rec: null };
  var clean = text.substring(0, m.index).trimEnd();
  var parts = m[1].split('|');
  var created = parts[0] || null;
  var reviewed = null, importance = null, legacyTier = null, tags = [], expiry = null, source = null, rec = null;
  for (var i = 1; i < parts.length; i++) {
    var p = parts[i];
    if (p.indexOf('rec:') === 0) rec = p.substring(4);
    else if (p.indexOf('r:') === 0) reviewed = p.substring(2);
    else if (p.indexOf('i:') === 0) importance = parseInt(p.substring(2), 10);
    else if (p.indexOf('t:') === 0) legacyTier = p.substring(2);
    else if (p.indexOf('#') === 0) tags = p.substring(1).split(',').filter(Boolean);
    else if (p.indexOf('x:') === 0) expiry = p.substring(2);
    else if (p.indexOf('s:') === 0) source = p.substring(2);
  }
  if (importance === null || isNaN(importance)) importance = ({ core: 5, active: 3, ref: 2, temp: 1 })[legacyTier] || 3;
  importance = Math.max(1, Math.min(5, importance));
  return { text: clean, created: created, reviewed: reviewed, importance: importance, tags: tags, expiry: expiry, source: source, rec: rec };
}

function stripTs(text) { return text.replace(/\s*\{\{[^}]*\}\}/, "").trim(); }

function todayStr() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function daysSince(dateStr) {
  if (!dateStr) return 9999;
  var then = new Date(dateStr + "T00:00:00");
  if (isNaN(then.getTime())) return 9999;
  var now = new Date();
  return Math.floor((now - then) / 86400000);
}

function relDate(dateStr) {
  if (!dateStr) return "";
  var d = daysSince(dateStr);
  if (isNaN(d) || d >= 9999) return "";
  if (d === 0) return "today";
  if (d === 1) return "1d";
  if (d < 30) return d + "d";
  if (d < 365) return Math.floor(d / 30) + "mo";
  return Math.floor(d / 365) + "y";
}

function parseMd(content) {
  var items = [];
  var lines = content.split("\n");
  for (var i = 0; i < lines.length; i++) {
    var raw = lines[i];
    var trimmed = raw.trim();
    if (!trimmed) continue;
    if (trimmed.startsWith("<!-- color:")) continue;
    if (trimmed.startsWith("## ")) {
      items.push({ type: "section", text: trimmed.slice(3) });
    } else if (raw.startsWith("  - ") || raw.startsWith("\t- ")) {
      var p = parseMeta(trimmed.slice(2));
      items.push({ type: "bullet", text: p.text, created: p.created, reviewed: p.reviewed, importance: p.importance, tags: p.tags, expiry: p.expiry, source: p.source, rec: p.rec, indent: 1 });
    } else if (trimmed.startsWith("- ")) {
      var p = parseMeta(trimmed.slice(2));
      items.push({ type: "bullet", text: p.text, created: p.created, reviewed: p.reviewed, importance: p.importance, tags: p.tags, expiry: p.expiry, source: p.source, rec: p.rec, indent: 0 });
    }
  }
  return items;
}

function toMd(items) {
  var lines = [];
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    if (it.type === "section") {
      if (lines.length > 0) lines.push("");
      lines.push("## " + it.text);
    } else {
      var prefix = it.indent ? "  - " : "- ";
      var meta = "";
      if (it.created) {
        meta = " {{" + it.created;
        if (it.reviewed) meta += "|r:" + it.reviewed;
        meta += "|i:" + (it.importance || 3);
        if (it.source) meta += "|s:" + it.source;
        if (it.tags && it.tags.length) meta += "|#" + it.tags.join(",");
        if (it.expiry) meta += "|x:" + it.expiry;
        if (it.rec) meta += "|rec:" + it.rec;
        meta += "}}";
      }
      lines.push(prefix + it.text + meta);
    }
  }
  return lines.join("\n") + "\n";
}

function renderRichEditor(container, items) {
  container.innerHTML = "";
  container._items = items;
  var dragSrc = null;

  for (var i = 0; i < items.length; i++) {
    (function(idx) {
      var it = items[idx];
      if (it.type === "section") {
        var row = document.createElement("div");
        row.className = "re-section";
        var inp = document.createElement("input");
        inp.className = "re-section-text";
        inp.value = it.text;
        inp.addEventListener("input", function() { items[idx].text = this.value; });
        var addBtn = document.createElement("button");
        addBtn.className = "re-section-add";
        addBtn.textContent = "+";
        addBtn.title = "add bullet";
        addBtn.addEventListener("click", function() {
          var newItem = { type: "bullet", text: "", created: todayStr(), reviewed: null, importance: 3, tags: [], expiry: null, source: "manual", indent: 0 };
          var insertAt = idx + 1;
          while (insertAt < items.length && items[insertAt].type === "bullet") insertAt++;
          items.splice(insertAt, 0, newItem);
          renderRichEditor(container, items);
          var newRow = container.querySelectorAll(".re-item")[0];
          var all = container.querySelectorAll(".re-item");
          for (var k = 0; k < all.length; k++) {
            if (all[k]._idx === insertAt) { all[k].querySelector(".re-text").focus(); break; }
          }
        });
        row.appendChild(inp);
        row.appendChild(addBtn);
        container.appendChild(row);
      } else {
        var row = document.createElement("div");
        row.className = "re-item" + (it.indent ? " re-sub" : "");
        row.draggable = true;
        row._idx = idx;

        row.addEventListener("dragstart", function(e) {
          dragSrc = idx;
          row.classList.add("re-dragging");
          e.dataTransfer.effectAllowed = "move";
        });
        row.addEventListener("dragend", function() {
          row.classList.remove("re-dragging");
          dragSrc = null;
          var overs = container.querySelectorAll(".re-drag-over");
          for (var k = 0; k < overs.length; k++) overs[k].classList.remove("re-drag-over");
        });
        row.addEventListener("dragover", function(e) {
          e.preventDefault();
          if (dragSrc !== null && dragSrc !== idx) row.classList.add("re-drag-over");
        });
        row.addEventListener("dragleave", function() { row.classList.remove("re-drag-over"); });
        row.addEventListener("drop", function(e) {
          e.preventDefault();
          row.classList.remove("re-drag-over");
          if (dragSrc === null || dragSrc === idx) return;
          var moved = items.splice(dragSrc, 1)[0];
          var target = idx > dragSrc ? idx - 1 : idx;
          items.splice(target, 0, moved);
          renderRichEditor(container, items);
        });

        var grip = document.createElement("span");
        grip.className = "re-grip";
        grip.textContent = "\u2847";

        var impWrap = document.createElement("span");
        impWrap.className = "re-imp";
        impWrap.title = "importance — click a pip to set 1-5";
        var curImp = it.importance || 3;
        for (var pip = 1; pip <= 5; pip++) {
          (function(level, idx_c) {
            var dot = document.createElement("span");
            dot.className = "re-pip" + (level <= curImp ? " re-pip-on" : "");
            dot.addEventListener("click", function() {
              items[idx_c].importance = level;
              renderRichEditor(container, items);
            });
            impWrap.appendChild(dot);
          })(pip, idx);
        }

        var srcBadge = null;
        if (it.source) {
          srcBadge = document.createElement("span");
          srcBadge.className = "re-source re-source-" + it.source;
          srcBadge.textContent = it.source === "manual" ? "M" : it.source === "claude" ? "C" : it.source === "claude_code" ? "CC" : it.source === "perplexity" ? "P" : it.source[0].toUpperCase();
          srcBadge.title = it.source;
        }

        var recBadge = null;
        if (it.rec) {
          recBadge = document.createElement("span");
          recBadge.className = "re-rec re-rec-" + it.rec;
          recBadge.textContent = it.rec === "confirmed" ? "REC\u2713" : "REC";
          recBadge.title = it.rec === "confirmed" ? "confirmed recommendation" : "pending recommendation";
          recBadge.addEventListener("click", (function(idx_c) {
            return function() {
              var states = [null, 'pending', 'confirmed'];
              var cur = states.indexOf(items[idx_c].rec);
              items[idx_c].rec = states[(cur + 1) % states.length];
              renderRichEditor(container, items);
            };
          })(idx));
        }

        var textEl = document.createElement("span");
        textEl.className = "re-text";
        textEl.contentEditable = "true";
        textEl.textContent = it.text;
        textEl.addEventListener("input", function() { items[idx].text = this.textContent; });
        textEl.addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            e.preventDefault();
            var newItem = { type: "bullet", text: "", created: todayStr(), reviewed: null, importance: it.importance || 3, tags: [], expiry: null, source: "manual", rec: null, indent: it.indent };
            items.splice(idx + 1, 0, newItem);
            renderRichEditor(container, items);
            var all = container.querySelectorAll(".re-item");
            for (var k = 0; k < all.length; k++) {
              if (all[k]._idx === idx + 1) { all[k].querySelector(".re-text").focus(); break; }
            }
          }
          if (e.key === "Tab") {
            e.preventDefault();
            if (e.shiftKey) { items[idx].indent = 0; }
            else { items[idx].indent = 1; }
            renderRichEditor(container, items);
          }
          if (e.key === "Backspace" && !this.textContent) {
            e.preventDefault();
            items.splice(idx, 1);
            renderRichEditor(container, items);
          }
        });

        var staleDate = it.reviewed || it.created;
        var staleDays = daysSince(staleDate);

        var actions = document.createElement("span");
        actions.className = "re-actions";

        var indBtn = document.createElement("button");
        indBtn.className = "re-act";
        indBtn.textContent = it.indent ? "\u2190" : "\u2192";
        indBtn.title = it.indent ? "outdent" : "indent";
        indBtn.addEventListener("click", function() {
          items[idx].indent = it.indent ? 0 : 1;
          renderRichEditor(container, items);
        });

        var delBtn = document.createElement("button");
        delBtn.className = "re-act re-del";
        delBtn.textContent = "\u00d7";
        delBtn.addEventListener("click", function() {
          items.splice(idx, 1);
          renderRichEditor(container, items);
        });

        actions.appendChild(indBtn);
        actions.appendChild(delBtn);
        if (it.indent) row.style.marginLeft = "20px";
        row.appendChild(grip);
        row.appendChild(impWrap);
        if (srcBadge) row.appendChild(srcBadge);
        if (recBadge) row.appendChild(recBadge);
        if (staleDays >= 150 && (it.importance || 3) <= 3) {
          var staleBadge = document.createElement("span");
          staleBadge.className = "re-stale";
          staleBadge.textContent = "!";
          staleBadge.title = "stale - " + staleDays + " days since last update";
          row.appendChild(staleBadge);
        }
        row.appendChild(textEl);
        row.appendChild(actions);
        container.appendChild(row);
      }
    })(i);
  }

  if (items.length === 0 || items[items.length - 1].type === "section") {
    var addBtn = document.createElement("button");
    addBtn.className = "re-add-btn";
    addBtn.textContent = "+ add bullet";
    addBtn.addEventListener("click", function() {
      items.push({ type: "bullet", text: "", created: todayStr(), reviewed: null, importance: 3, tags: [], expiry: null, source: "manual", indent: 0 });
      renderRichEditor(container, items);
      var all = container.querySelectorAll(".re-text");
      if (all.length) all[all.length - 1].focus();
    });
    container.appendChild(addBtn);
  }

  var addSecBtn = document.createElement("button");
  addSecBtn.className = "re-add-btn";
  addSecBtn.textContent = "+ add section";
  addSecBtn.addEventListener("click", function() {
    items.push({ type: "section", text: "" });
    items.push({ type: "bullet", text: "", created: todayStr(), reviewed: null, importance: 3, tags: [], expiry: null, source: "manual", indent: 0 });
    renderRichEditor(container, items);
    var allSec = container.querySelectorAll(".re-section-text");
    if (allSec.length) allSec[allSec.length - 1].focus();
  });
  container.appendChild(addSecBtn);
}

  return container._items || [];
}

  var r = parseInt(hex.slice(1,3),16);

var STOP_WORDS = {'the':1,'a':1,'an':1,'is':1,'are':1,'was':1,'were':1,'in':1,'on':1,'at':1,'to':1,'for':1,'of':1,'with':1,'and':1,'or':1,'but':1,'not':1,'this':1,'that':1,'it':1,'be':1,'has':1,'had':1,'have':1,'do':1,'does':1,'did':1,'will':1,'would':1,'could':1,'should':1,'may':1,'might':1,'can':1,'from':1,'by':1,'as':1,'so':1,'if':1,'than':1,'then':1,'only':1,'just':1,'also':1,'very':1,'too':1,'more':1,'most':1,'some':1,'any':1,'all':1,'each':1,'every':1,'such':1,'into':1,'over':1,'after':1,'before':1,'between':1,'about':1,'like':1,'been':1,'being':1,'its':1,'my':1,'our':1,'your':1,'his':1,'her':1,'their':1,'what':1,'which':1,'who':1,'whom':1,'when':1,'where':1,'how':1,'why':1,'no':1,'yes':1,'up':1,'out':1,'new':1,'old':1,'first':1,'since':1,'won':1,'placed':1,'got':1,'made':1,'year':1,'one':1,'two':1};

function extractKeywords(text) {
  var words = text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/);
  var kw = [];
  for (var i = 0; i < words.length; i++) {
    if (words[i].length > 2 && !STOP_WORDS[words[i]]) kw.push(words[i]);
  }
  return kw;
}

var IMP_STYLE = {
  5: { baseR: 3.2, baseAlpha: 0.62, glow: true },
  4: { baseR: 2.6, baseAlpha: 0.48, glow: true },
  3: { baseR: 2.0, baseAlpha: 0.38, glow: false },
  2: { baseR: 1.5, baseAlpha: 0.26, glow: false },
  1: { baseR: 1.1, baseAlpha: 0.16, glow: false }
};

var CELL = 80;
var EDGE_DIST = 140;
var MOUSE_R = 120;
var BRIDGE_DIST = 180;
var grid = {};

function gridKey(x, y) { return (x / CELL | 0) + "," + (y / CELL | 0); }

function rebuildGrid() {
  grid = {};
  for (var i = 0; i < nodes.length; i++) {
    var k = gridKey(nodes[i].x, nodes[i].y);
    if (!grid[k]) grid[k] = [];
    grid[k].push(i);
  }
}

function gridNear(x, y, r) {
  var out = [];
  var x0 = (x - r) / CELL | 0, x1 = (x + r) / CELL | 0;
  var y0 = (y - r) / CELL | 0, y1 = (y + r) / CELL | 0;
  for (var gx = x0; gx <= x1; gx++)
    for (var gy = y0; gy <= y1; gy++) {
      var c = grid[gx + "," + gy];
      if (c) for (var i = 0; i < c.length; i++) out.push(c[i]);
    }
  return out;
}

function gaussClamped() {
  var u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  var g = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return Math.max(-2.2, Math.min(2.2, g));
}

function buildGraph(data) {
  nodes = [];
  edges = [];
  clusterMeta = [];

  var files = data.files;
  var fc = files.length;
  if (!fc) return;

  var mx = W * 0.10;
  var my = H * 0.10;
  var useW = W - mx * 2;
  var useH = H - my * 2;

  var cols = Math.max(1, Math.round(Math.sqrt(fc * useW / useH)));
  var rows = Math.ceil(fc / cols);
  var cellW = useW / cols;
  var cellH = useH / rows;
  var pad = 15;

  for (var f = 0; f < fc; f++) {
    var col = f % cols;
    var row = Math.floor(f / cols);
    var cx = mx + cellW * (col + 0.5);
    var cy = my + cellH * (row + 0.5);
    var sx = cellW * 0.30;
    var sy = cellH * 0.30;

    for (var n = 0; n < files[f].nodes.length; n++) {
      var nd = files[f].nodes[n];
      var nodeText = (typeof nd === "string") ? nd : nd.text;
      var nodeImportance = (typeof nd === "object" && nd.importance) ? nd.importance : 3;
      var nodeTags = (typeof nd === "object" && nd.tags) ? nd.tags : [];
      var nodeCreated = (typeof nd === "object" && nd.created) ? nd.created : null;
      var nodeSource = (typeof nd === "object" && nd.source) ? nd.source : "manual";
      var ts = IMP_STYLE[nodeImportance] || IMP_STYLE[3];

      var nx = cx + gaussClamped() * sx;
      var ny = cy + gaussClamped() * sy;
      nx = Math.max(pad, Math.min(W - pad, nx));
      ny = Math.max(pad, Math.min(H - pad, ny));

      nodes.push({
        x: nx, y: ny, bx: nx, by: ny, vx: 0, vy: 0,
        r: ts.baseR + Math.random() * 0.8,
        text: nodeText,
        importance: nodeImportance,
        tags: nodeTags,
        created: nodeCreated,
        source: nodeSource,
        glow: ts.glow,
        file: files[f].name,
        cluster: f,
        alpha: ts.baseAlpha + Math.random() * 0.15,
        phase: Math.random() * Math.PI * 2,
        freq: 0.00012 + Math.random() * 0.0002,
        drift: 0.4 + Math.random() * 0.8
      });
    }
  }

  separate();

  for (var i = 0; i < nodes.length; i++) {
    nodes[i].bx = nodes[i].x;
    nodes[i].by = nodes[i].y;
  }

  buildEdges();

  for (var f = 0; f < fc; f++) {
    var angle = (Math.random() - 0.5) * 0.5;
    clusterMeta.push({ color: files[f].color || null, name: files[f].name, scope: files[f].scope || "all", angle: angle, indices: [], glow: 0, glowType: "" });
  }
  for (var i = 0; i < nodes.length; i++) {
    clusterMeta[nodes[i].cluster].indices.push(i);
  }

  flashTime = 0;
}

function separate() {
  var minD = 7;
  for (var pass = 0; pass < 20; pass++) {
    rebuildGrid();
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var near = gridNear(n.x, n.y, minD);
      for (var j = 0; j < near.length; j++) {
        if (near[j] <= i) continue;
        var m = nodes[near[j]];
        var dx = n.x - m.x, dy = n.y - m.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < minD && d > 0.01) {
          var push = (minD - d) * 0.5;
          var ux = dx / d, uy = dy / d;
          n.x += ux * push;
          n.y += uy * push;
          m.x -= ux * push;
          m.y -= uy * push;
        }
      }
      n.x = Math.max(10, Math.min(W - 10, n.x));
      n.y = Math.max(10, Math.min(H - 10, n.y));
    }
  }
}

function buildEdges() {
  edges = [];
  rebuildGrid();
  var added = {};

  for (var i = 0; i < nodes.length; i++) {
    var near = gridNear(nodes[i].x, nodes[i].y, EDGE_DIST);
    var sorted = [];
    for (var j = 0; j < near.length; j++) {
      if (near[j] === i) continue;
      if (nodes[near[j]].cluster !== nodes[i].cluster) continue;
      var m = nodes[near[j]];
      var dx = nodes[i].x - m.x, dy = nodes[i].y - m.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < EDGE_DIST) sorted.push({ idx: near[j], d: d });
    }
    sorted.sort(function(a, b) { return a.d - b.d; });

    var count = 0;
    for (var j = 0; j < sorted.length && count < 5; j++) {
      var lo = Math.min(i, sorted[j].idx), hi = Math.max(i, sorted[j].idx);
      var key = lo * 100000 + hi;
      if (added[key]) continue;
      added[key] = true;
      edges.push({
        a: i, b: sorted[j].idx, d: sorted[j].d,
        t: Math.random(),
        speed: 0.00006 + Math.random() * 0.00015,
        live: Math.random() < 0.04
      });
      count++;
    }
  }

  var nodeKw = [];
  var kwIndex = {};
  for (var i = 0; i < nodes.length; i++) {
    var kw = extractKeywords(nodes[i].text);
    nodeKw.push(kw);
    for (var k = 0; k < kw.length; k++) {
      if (!kwIndex[kw[k]]) kwIndex[kw[k]] = [];
      kwIndex[kw[k]].push(i);
    }
  }

  var semanticEdges = [];
  var semPerNode = {};
  for (var i = 0; i < nodes.length; i++) {
    if (!nodeKw[i].length) continue;
    var candidates = {};
    for (var k = 0; k < nodeKw[i].length; k++) {
      var matches = kwIndex[nodeKw[i][k]];
      if (!matches) continue;
      for (var m = 0; m < matches.length; m++) {
        var j = matches[m];
        if (j <= i || nodes[j].cluster === nodes[i].cluster) continue;
        if (!candidates[j]) candidates[j] = 0;
        candidates[j]++;
      }
    }
    for (var j in candidates) {
      var jIdx = parseInt(j);
      var shared = candidates[j];
      var maxLen = Math.max(nodeKw[i].length, nodeKw[jIdx].length);
      var score = shared / maxLen;
      if (shared >= 2 && score >= 0.3) {
        semanticEdges.push({ a: i, b: jIdx, score: score, shared: shared });
      }
    }
  }

  semanticEdges.sort(function(a, b) { return b.score - a.score; });

  var maxSemantic = Math.max(12, Math.floor(nodes.length * 0.1));
  var semCount = 0;
  for (var i = 0; i < semanticEdges.length && semCount < maxSemantic; i++) {
    var se = semanticEdges[i];
    var lo = Math.min(se.a, se.b), hi = Math.max(se.a, se.b);
    var edgeKey = lo * 100000 + hi;
    if (added[edgeKey]) continue;
    if ((semPerNode[se.a] || 0) >= 2 && (semPerNode[se.b] || 0) >= 2) continue;
    added[edgeKey] = true;
    semPerNode[se.a] = (semPerNode[se.a] || 0) + 1;
    semPerNode[se.b] = (semPerNode[se.b] || 0) + 1;
    var na = nodes[se.a], nb = nodes[se.b];
    var ddx = na.x - nb.x, ddy = na.y - nb.y;
    var dist = Math.sqrt(ddx * ddx + ddy * ddy);
    edges.push({
      a: se.a, b: se.b, d: dist,
      t: Math.random(),
      speed: 0.00004 + Math.random() * 0.0001,
      live: Math.random() < 0.08,
      semantic: true,
      strength: se.score,
      curve: (Math.random() - 0.5) * 0.3
    });
    semCount++;
  }
}

function fetchBrain() {
  fetch("/brain")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      brainData = d;
      var canvasData = { files: [] };
      for (var i = 0; i < d.files.length; i++) {
        if (d.files[i].nodes.length > 0) canvasData.files.push(d.files[i]);
      }
      buildGraph(canvasData);
      if (managerOpen) renderClusterList();
      if (timelineActive) buildTimeline();
    })
    .catch(function() {});
}

var now = 0;
function frame(ts) {
  var dt = ts - now; now = ts;
  if (dt > 100) dt = 16;
  if (timelineActive) { requestAnimationFrame(frame); return; }
  gc.clearRect(0, 0, W, H);

  for (var ci = 0; ci < clusterMeta.length; ci++) {
    var cm = clusterMeta[ci];
    if (!showColors || !cm.color || cm.indices.length < 1) continue;
    var cx = 0, cy = 0;
    for (var j = 0; j < cm.indices.length; j++) {
      cx += nodes[cm.indices[j]].x;
      cy += nodes[cm.indices[j]].y;
    }
    cx /= cm.indices.length;
    cy /= cm.indices.length;
    var maxR = 0;
    for (var j = 0; j < cm.indices.length; j++) {
      var ddx = nodes[cm.indices[j]].x - cx, ddy = nodes[cm.indices[j]].y - cy;
      var dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd > maxR) maxR = dd;
    }
    maxR += 30;
    var grad = gc.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    grad.addColorStop(0, hexToRgba(cm.color, 0.16));
    grad.addColorStop(0.6, hexToRgba(cm.color, 0.08));
    grad.addColorStop(1, hexToRgba(cm.color, 0));
    gc.beginPath();
    gc.arc(cx, cy, maxR, 0, Math.PI * 2);
    gc.fillStyle = grad;
    gc.fill();
  }

  if (flashTime > 0) flashTime = Math.max(0, flashTime - dt * 0.002);

  for (var ci = 0; ci < clusterMeta.length; ci++) {
    var cm = clusterMeta[ci];
    if (cm.glow <= 0) continue;
    cm.glow = Math.max(0, cm.glow - dt * 0.0004);
    var cx = 0, cy = 0;
    for (var j = 0; j < cm.indices.length; j++) {
      cx += nodes[cm.indices[j]].x;
      cy += nodes[cm.indices[j]].y;
    }
    if (cm.indices.length === 0) continue;
    cx /= cm.indices.length;
    cy /= cm.indices.length;
    var maxR = 0;
    for (var j = 0; j < cm.indices.length; j++) {
      var ddx = nodes[cm.indices[j]].x - cx, ddy = nodes[cm.indices[j]].y - cy;
      var dd = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dd > maxR) maxR = dd;
    }
    maxR += 50;
    var glowA = cm.glow * 0.35;
    var glowColor = cm.glowType === "write" ? "255,180,60" : "80,160,255";
    var grd = gc.createRadialGradient(cx, cy, 0, cx, cy, maxR);
    grd.addColorStop(0, "rgba(" + glowColor + "," + (glowA * 0.7) + ")");
    grd.addColorStop(0.4, "rgba(" + glowColor + "," + (glowA * 0.3) + ")");
    grd.addColorStop(1, "rgba(" + glowColor + ",0)");
    gc.beginPath();
    gc.arc(cx, cy, maxR, 0, Math.PI * 2);
    gc.fillStyle = grd;
    gc.fill();

    for (var j = 0; j < cm.indices.length; j++) {
      var ni = cm.indices[j];
      var nn = nodes[ni];
      var pulseR = nn.r * (2 + cm.glow * 4);
      var pulseA = cm.glow * 0.25;
      gc.beginPath();
      gc.arc(nn.x, nn.y, pulseR, 0, Math.PI * 2);
      gc.fillStyle = "rgba(" + glowColor + "," + pulseA + ")";
      gc.fill();
    }
  }

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var tx = n.bx + Math.sin(ts * n.freq + n.phase) * n.drift;
    var ty = n.by + Math.cos(ts * n.freq * 1.1 + n.phase + 1.3) * n.drift;

    var dx = mouse.x - n.x, dy = mouse.y - n.y;
    var dm = Math.sqrt(dx * dx + dy * dy);
    if (dm < MOUSE_R && dm > 0) {
      var pull = (1 - dm / MOUSE_R) * 0.005;
      tx += dx * pull * 8;
      ty += dy * pull * 8;
    }

    n.vx += (tx - n.x) * 0.02;
    n.vy += (ty - n.y) * 0.02;
    n.vx *= 0.88;
    n.vy *= 0.88;
    n.x += n.vx;
    n.y += n.vy;
  }

  gc.beginPath();
  gc.strokeStyle = FC(0.08 + flashTime * 0.02);
  gc.lineWidth = 0.5;
  for (var i = 0; i < edges.length; i++) {
    if (!edges[i].semantic) {
      gc.moveTo(nodes[edges[i].a].x, nodes[edges[i].a].y);
      gc.lineTo(nodes[edges[i].b].x, nodes[edges[i].b].y);
    }
  }
  gc.stroke();

  gc.beginPath();
  gc.strokeStyle = FC(0.12 + flashTime * 0.03);
  gc.lineWidth = 0.6;
  for (var i = 0; i < edges.length; i++) {
    if (edges[i].semantic) {
      var sa = nodes[edges[i].a], sb = nodes[edges[i].b];
      var mx = (sa.x + sb.x) / 2, my = (sa.y + sb.y) / 2;
      var dx = sb.x - sa.x, dy = sb.y - sa.y;
      var c = edges[i].curve || 0;
      gc.moveTo(sa.x, sa.y);
      gc.quadraticCurveTo(mx + (-dy) * c, my + dx * c, sb.x, sb.y);
    }
  }
  gc.stroke();

  for (var i = 0; i < edges.length; i++) {
    var e = edges[i];
    var a = nodes[e.a], b = nodes[e.b];
    var isConn = (activeNode !== null && (e.a === activeNode || e.b === activeNode)) ||
                 (hoverNode >= 0 && (e.a === hoverNode || e.b === hoverNode));

    if (isConn) {
      gc.beginPath();
      if (e.semantic) {
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var edx = b.x - a.x, edy = b.y - a.y;
        var ec = e.curve || 0;
        gc.moveTo(a.x, a.y);
        gc.quadraticCurveTo(mx + (-edy) * ec, my + edx * ec, b.x, b.y);
      } else {
        gc.moveTo(a.x, a.y);
        gc.lineTo(b.x, b.y);
      }
      gc.strokeStyle = e.semantic ? "rgba(80,120,200,0.3)" : FC(0.3);
      gc.lineWidth = e.semantic ? 1.2 : 1;
      gc.stroke();
    }

    if (e.live) {
      e.t += dt * e.speed;
      if (e.t > 1) { e.t -= 1; if (Math.random() < 0.2) e.live = false; }
      var t = e.t;
      var px, py;
      if (e.semantic) {
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var edx = b.x - a.x, edy = b.y - a.y;
        var ec = e.curve || 0;
        var cx = mx + (-edy) * ec, cy = my + edx * ec;
        px = (1-t)*(1-t)*a.x + 2*(1-t)*t*cx + t*t*b.x;
        py = (1-t)*(1-t)*a.y + 2*(1-t)*t*cy + t*t*b.y;
      } else {
        px = a.x + (b.x - a.x) * t;
        py = a.y + (b.y - a.y) * t;
      }
      gc.beginPath();
      gc.arc(px, py, 0.7, 0, Math.PI * 2);
      gc.fillStyle = FC(0.18);
      gc.fill();
    }
  }

  var hasGlow = false;
  for (var ci = 0; ci < clusterMeta.length; ci++) {
    if (clusterMeta[ci].glow > 0.1) { hasGlow = true; break; }
  }
  var spawnRate = hasGlow ? 0.03 : 0.004;
  if (Math.random() < spawnRate * (dt / 16)) {
    var ri = Math.floor(Math.random() * edges.length);
    if (edges[ri]) edges[ri].live = true;
  }

  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    var isHot = i === hoverNode || i === activeNode;

    if (n.glow) {
      gc.beginPath();
      gc.arc(n.x, n.y, n.r * 4, 0, Math.PI * 2);
      gc.fillStyle = "rgba(180,140,50,0.035)";
      gc.fill();
    }

    if (isHot) {
      gc.beginPath();
      gc.arc(n.x, n.y, n.r * 5, 0, Math.PI * 2);
      gc.fillStyle = FC(0.04);
      gc.fill();
    }

    var cmGlow = (n.cluster !== undefined && clusterMeta[n.cluster]) ? clusterMeta[n.cluster].glow : 0;
    var r = isHot ? n.r * 2.2 : n.r * (1 + cmGlow * 1.5);
    var a = isHot ? 0.7 : Math.min(1, n.alpha + cmGlow * 0.5);

    gc.beginPath();
    gc.arc(n.x, n.y, r, 0, Math.PI * 2);
    if (cmGlow > 0.01 && !isHot) {
      var glC = clusterMeta[n.cluster].glowType === "write" ? "255,180,60" : "80,160,255";
      gc.fillStyle = "rgba(" + glC + "," + (a * 0.8) + ")";
    } else {
      gc.fillStyle = FC(a);
    }
    gc.fill();
  }

  if (activeNode !== null && nodes[activeNode]) {
    var an = nodes[activeNode];
    var ttx = an.x + 14, tty = an.y - 14;
    if (ttx + 340 > W) ttx = an.x - 354;
    if (tty < 10) tty = an.y + 14;
    tooltip.style.left = ttx + "px";
    tooltip.style.top = tty + "px";
  }

  if (showLabels) {
    gc.font = "500 11px 'JetBrains Mono', monospace";
    gc.fillStyle = FC(0.13);
    gc.textAlign = "center";
    gc.textBaseline = "middle";
    for (var ci = 0; ci < clusterMeta.length; ci++) {
      var cm = clusterMeta[ci];
      if (cm.indices.length < 1) continue;
      var lx = 0, ly = 0;
      for (var j = 0; j < cm.indices.length; j++) {
        lx += nodes[cm.indices[j]].x;
        ly += nodes[cm.indices[j]].y;
      }
      lx /= cm.indices.length;
      ly /= cm.indices.length;
      gc.save();
      gc.translate(lx, ly);
      gc.rotate(cm.angle);
      gc.fillText(cm.name, 0, 0);
      gc.restore();
    }
  }

  requestAnimationFrame(frame);
}

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}

var _seenTs = 0;
setInterval(function() {
  fetch("/activity").then(function(r) { return r.json(); }).then(function(acts) {
    var maxTs = _seenTs;
    for (var i = 0; i < acts.length; i++) {
      var a = acts[i];
      if (a.ts <= _seenTs) continue;
      if (a.ts > maxTs) maxTs = a.ts;
      var cname = a.cluster.replace(/\.md$/, "");
      for (var ci = 0; ci < clusterMeta.length; ci++) {
        if (clusterMeta[ci].name === cname) {
          clusterMeta[ci].glow = 1;
          clusterMeta[ci].glowType = a.action || "read";
          break;
        }
      }
    }
    _seenTs = maxTs;
  }).catch(function() {});
}, 2000);

cv.addEventListener("mousemove", function(e) {
  mouse.x = e.clientX;
  mouse.y = e.clientY;

  if (activeNode !== null) return;

  var hit = -1;
  var best = 12;
  for (var i = 0; i < nodes.length; i++) {
    var dx = nodes[i].x - e.clientX, dy = nodes[i].y - e.clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < best) { best = d; hit = i; }
  }
  hoverNode = hit;

  if (hit >= 0) {
    var imp = nodes[hit].importance || 3;
    var tierTag = ' <span style="font-size:9px;letter-spacing:1px;margin-left:4px;">';
    for (var pi = 1; pi <= 5; pi++) tierTag += '<span style="opacity:' + (pi <= imp ? 0.8 : 0.18) + ';">●</span>';
    tierTag += '</span>';
    var srcTag = '';
    if (nodes[hit].source) {
      var sc = nodes[hit].source;
      var srcColor = (sc === 'claude' || sc === 'claude_code') ? 'rgba(204,108,29,0.7)' : sc === 'perplexity' ? 'rgba(120,80,200,0.7)' : sc === 'manual' ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.25)';
      srcTag = ' <span style="font-size:8px;letter-spacing:0.05em;color:' + srcColor + ';">' + sc + '</span>';
    }
    tooltip.innerHTML = '<div class="tt-file">' + nodes[hit].file + tierTag + srcTag + '</div>' + nodes[hit].text;
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY - 8) + "px";
    tooltip.classList.add("visible");
  } else {
    tooltip.classList.remove("visible");
  }
});

cv.addEventListener("mouseleave", function() {
  mouse.x = -9999;
  mouse.y = -9999;
  if (activeNode === null) {
    hoverNode = -1;
    tooltip.classList.remove("visible");
  }
});

cv.addEventListener("click", function(e) {
  var hit = -1;
  var best = 14;
  for (var i = 0; i < nodes.length; i++) {
    var dx = nodes[i].x - e.clientX, dy = nodes[i].y - e.clientY;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < best) { best = d; hit = i; }
  }

  if (hit >= 0) {
    openEditor(nodes[hit].file + ".md");
  } else {
    activeNode = null;
    hoverNode = -1;
    tooltip.classList.remove("visible");
  }
});

function sendChat() {
  var msg = input.value.trim();
  if (!msg) return;
  lastUserMsg = msg;
  input.value = "";
  addMsg(msg, "msg-user");
  var dots = showThinking();

  fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: msg, compact: contextMode === "compact" })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    dots.remove();
    if (d.error) {
      addMsg("error: " + d.error, "msg-system");
      return;
    }
    addMsg(d.reply, "msg-ai");
  })
  .catch(function() {
    dots.remove();
    addMsg("connection failed", "msg-system");
  });
}

saveBtn.addEventListener("click", function() {
  if (!lastUserMsg) return;
  var dots = showThinking();

  fetch("/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: lastUserMsg })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    dots.remove();
    if (d.error) {
      addMsg("save failed: parse error", "msg-system");
      toast("save failed", true);
      return;
    }
    var pending = d.updates.filter(function(u) { return u.pending; });
    var saved = d.updates.filter(function(u) { return !u.pending; });
    if (saved.length) {
      var files = saved.map(function(u) { return u.file; });
      var unique = files.filter(function(f, i) { return files.indexOf(f) === i; });
      addMsg("saved: " + unique.join(", "), "msg-system");
      toast("saved to " + unique.join(", "));
    }
    if (pending.length) {
      showConflicts(pending);
    }
    flashTime = 1;
    fetchBrain();
  })
  .catch(function() {
    dots.remove();
    addMsg("save failed", "msg-system");
    toast("save failed", true);
  });
});

var toastEl = document.getElementById("toast");
var toastTimer = null;
function toast(msg, isError, duration) {
  if (!toastEl) toastEl = document.getElementById("toast");
  if (!toastEl) return;
  clearTimeout(toastTimer);
  toastEl.textContent = msg;
  toastEl.className = "toast" + (isError ? " toast-error" : "");
  requestAnimationFrame(function() {
    toastEl.classList.add("toast-show");
  });
  toastTimer = setTimeout(function() {
    toastEl.classList.remove("toast-show");
  }, duration || 2000);
}

function openEditor(filename) {
  editorTitle.textContent = filename;
  editorRich.innerHTML = '<div style="padding:14px;color:rgba(0,0,0,0.25);font-size:11px;">loading...</div>';
  editorDocId = "";
  editorFilename = filename;
  editorColorLine = null;
  editorOverlay.classList.add("editor-open");

  fetch("/memory?file=" + encodeURIComponent(filename))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) {
        editorRich.innerHTML = '<div style="padding:14px;color:rgba(180,0,0,0.5);font-size:11px;">error: ' + d.error + '</div>';
        return;
      }
      editorDocId = d.id;
      var content = d.content;
      var lines = content.split("\n");
      if (lines[0] && lines[0].trim().startsWith("<!-- color:")) {
        editorColorLine = lines[0];
        lines.shift();
        content = lines.join("\n");
      }
      var items = parseMd(content);
      renderRichEditor(editorRich, items);
    })
    .catch(function() {
      editorRich.innerHTML = '<div style="padding:14px;color:rgba(180,0,0,0.5);font-size:11px;">failed to load</div>';
    });
}

function closeEditor() {
  editorOverlay.classList.remove("editor-open");
}

function saveEditor() {
  if (!editorDocId) return;
  editorSave.textContent = "saving...";
  var items = collectItems(editorRich);
  var content = toMd(items);
  if (editorColorLine) content = editorColorLine + "\n" + content;

  fetch("/memory", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: editorDocId, content: content })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    editorSave.textContent = "save";
    if (d.ok) {
      toast("saved");
      fetchBrain();
    } else {
      toast("save failed", true);
    }
  })
  .catch(function() {
    editorSave.textContent = "save";
    toast("save failed", true);
  });
}

var searchInput = document.getElementById("railSearchInput");

function doSearch() {
  clearTimeout(searchTimer);
  var q = searchInput.value.trim();
  if (!q) {
    searchResults.classList.remove("sr-open");
    return;
  }
  fetch("/search?q=" + encodeURIComponent(q))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      searchResults.innerHTML = "";
      if (!d.results.length) {
        searchResults.classList.remove("sr-open");
        return;
      }
      for (var i = 0; i < d.results.length; i++) {
        var r = d.results[i];
        var div = document.createElement("div");
        div.className = "sr-item";
        div.setAttribute("data-file", r.filename);
        var html = '<div class="sr-file">' + r.filename + '</div>';
        for (var j = 0; j < Math.min(r.matches.length, 3); j++) {
          html += '<div class="sr-match">' + r.matches[j].replace(/</g, "&lt;") + '</div>';
        }
        div.innerHTML = html;
        div.addEventListener("click", (function(fn) {
          return function() {
            searchResults.classList.remove("sr-open");
            searchInput.value = "";
            openEditor(fn);
          };
        })(r.filename));
        searchResults.appendChild(div);
      }
      var sr = searchExpand.getBoundingClientRect();
      searchResults.style.bottom = (window.innerHeight - sr.top + 4) + "px";
      searchResults.classList.add("sr-open");
    });
}

function clusterFreshness(nodesArr) {
  var newest = null;
  for (var i = 0; i < nodesArr.length; i++) {
    var nd = nodesArr[i];
    var d = (typeof nd === "object") ? nd.created : null;
    if (!d && typeof nd === "string") {
      var p = parseTs(nd);
      d = p.reviewed || p.created;
    }
    if (d && (!newest || d > newest)) newest = d;
  }
  if (!newest) return { cls: "aging", text: "no dates" };
  var days = daysSince(newest);
  if (days <= 14) return { cls: "fresh", text: relDate(newest) };
  if (days <= 60) return { cls: "aging", text: relDate(newest) };
  return { cls: "stale", text: relDate(newest) };
}

function renderClusterList() {
  clusterListEl.innerHTML = "";
  if (!brainData) return;
  for (var i = 0; i < brainData.files.length; i++) {
    var f = brainData.files[i];
    var item = document.createElement("div");
    item.className = "cluster-item";

    var dot = document.createElement("div");
    dot.className = "cluster-dot";
    if (f.color) { dot.style.background = f.color; dot.style.borderColor = f.color; }

    var name = document.createElement("div");
    name.className = "cluster-name";
    name.textContent = f.name;

    var count = document.createElement("div");
    count.className = "cluster-count";
    count.textContent = f.nodes.length;

    var actions = document.createElement("div");
    actions.className = "cluster-actions";

    var eBtn = document.createElement("button");
    eBtn.innerHTML = "&#9998;";
    eBtn.title = "edit";
    eBtn.addEventListener("click", (function(fn) {
      return function(e) { e.stopPropagation(); showMgrEdit(fn + ".md"); };
    })(f.name));

    var dBtn = document.createElement("button");
    dBtn.className = "del-btn";
    dBtn.innerHTML = "&times;";
    dBtn.title = "delete";
    dBtn.addEventListener("click", (function(fn) {
      return function(e) {
        e.stopPropagation();
        showConfirm("delete " + fn + "?", function() { deleteCluster(fn + ".md"); });
      };
    })(f.name));

    actions.appendChild(eBtn);
    actions.appendChild(dBtn);
    item.appendChild(dot);
    item.appendChild(name);
    if (f.scope && f.scope !== "all") {
      var scopeBadge = document.createElement("span");
      scopeBadge.className = "cluster-scope cluster-scope-" + f.scope;
      scopeBadge.textContent = f.scope;
      item.appendChild(scopeBadge);
    }
    item.appendChild(count);
    item.appendChild(actions);
    clusterListEl.appendChild(item);
  }
}

function renderColorPicker(containerId, activeColor, onSelect) {
  var container = document.getElementById(containerId);
  container.innerHTML = "";

  var none = document.createElement("div");
  none.className = "color-none" + (!activeColor ? " color-active" : "");
  none.title = "no color";
  none.addEventListener("click", function() {
    onSelect(null);
    var all = container.querySelectorAll(".color-swatch,.color-none");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("color-active");
    none.classList.add("color-active");
  });
  container.appendChild(none);

  for (var i = 0; i < PALETTE.length; i++) {
    var sw = document.createElement("div");
    sw.className = "color-swatch" + (activeColor === PALETTE[i] ? " color-active" : "");
    sw.style.background = PALETTE[i];
    sw.addEventListener("click", (function(c, el) {
      return function() {
        onSelect(c);
        var all = container.querySelectorAll(".color-swatch,.color-none");
        for (var j = 0; j < all.length; j++) all[j].classList.remove("color-active");
        el.classList.add("color-active");
      };
    })(PALETTE[i], sw));
    container.appendChild(sw);
  }
}

var conflictOverlay = document.getElementById("conflictOverlay");
var conflictBox = document.getElementById("conflictBox");

function showConflicts(pendingUpdates) {
  conflictBox.innerHTML = "";
  var title = document.createElement("div");
  title.className = "conflict-title";
  title.textContent = "possible duplicate" + (pendingUpdates.length > 1 ? "s" : "") + " found";
  conflictBox.appendChild(title);

  var resolved = [];

  for (var i = 0; i < pendingUpdates.length; i++) {
    (function(u, idx) {
      var pair = document.createElement("div");
      pair.className = "conflict-pair";

      var existLabel = document.createElement("div");
      existLabel.className = "conflict-label";
      existLabel.textContent = "existing (" + u.file + ")";

      var existText = document.createElement("div");
      existText.className = "conflict-text conflict-old";
      existText.textContent = u.conflicts[0] ? stripTs(u.conflicts[0].existing) : "";

      var newLabel = document.createElement("div");
      newLabel.className = "conflict-label";
      newLabel.textContent = "new";

      var newText = document.createElement("div");
      newText.className = "conflict-text conflict-new";
      newText.textContent = stripTs(u.line);

      var acts = document.createElement("div");
      acts.className = "conflict-actions";

      var keepOld = document.createElement("button");
      keepOld.textContent = "keep old";
      var replaceBtn = document.createElement("button");
      replaceBtn.textContent = "replace";
      var keepBoth = document.createElement("button");
      keepBoth.textContent = "keep both";

      function resolve(action, replaceLine) {
        resolved.push({ file: u.file, line: u.line, action: action, replace_line: replaceLine || "" });
        pair.style.opacity = "0.3";
        pair.style.pointerEvents = "none";
        if (resolved.length === pendingUpdates.length) {
          fetch("/save/confirm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ updates: resolved })
          })
          .then(function(r) { return r.json(); })
          .then(function() {
            conflictOverlay.classList.remove("conflict-open");
            toast("conflicts resolved");
            fetchBrain();
          });
        }
      }

      keepOld.addEventListener("click", function() { resolve("discard"); });
      replaceBtn.addEventListener("click", function() { resolve("replace", u.conflicts[0] ? u.conflicts[0].existing : ""); });
      keepBoth.addEventListener("click", function() { resolve("keep_both"); });

      acts.appendChild(keepOld);
      acts.appendChild(replaceBtn);
      acts.appendChild(keepBoth);
      pair.appendChild(existLabel);
      pair.appendChild(existText);
      pair.appendChild(newLabel);
      pair.appendChild(newText);
      pair.appendChild(acts);
      conflictBox.appendChild(pair);
    })(pendingUpdates[i], i);
  }

  conflictOverlay.classList.add("conflict-open");
}

var captureInput = document.getElementById("railCaptureInput");
captureInput.addEventListener("keydown", function(e) {
  if (e.key !== "Enter") return;
  var text = captureInput.value.trim();
  if (!text) return;
  captureInput.value = "";

  var target = "";
  var atMatch = text.match(/^@(\S+)\s+/);
  if (atMatch) {
    target = atMatch[1];
    text = text.substring(atMatch[0].length).trim();
  }
  if (!text) return;

  toast(target ? "saving to " + target + "..." : "capturing...");
  fetch("/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text, target: target })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { toast("capture failed", true); return; }
    var pending = d.updates.filter(function(u) { return u.pending; });
    var saved = d.updates.filter(function(u) { return !u.pending; });
    if (saved.length) {
      var files = saved.map(function(u) { return u.file; });
      var unique = files.filter(function(f, i) { return files.indexOf(f) === i; });
      toast("saved to " + unique.join(", "));
    }
    if (pending.length) showConflicts(pending);
    flashTime = 1;
    fetchBrain();
    if (typeof closeAllRailExpands === "function") closeAllRailExpands();
  })
  .catch(function() { toast("capture failed", true); });
});

document.getElementById("reviewBtn").addEventListener("click", function() {

function reviewUpdateFile(filename, oldText, newText, action) {
  var cached = reviewFileCache[filename];
  if (!cached) return;
  var lines = cached.content.split("\n");
  var newLines = [];
  var found = false;
  for (var i = 0; i < lines.length; i++) {
    var stripped = lines[i].trim();
    if (!found && stripped.startsWith("- ") && stripTs(stripped.slice(2)) === oldText) {
      found = true;
      if (action === "delete") continue;
      if (action === "confirm") {
        var p = parseTs(stripped.slice(2));
        var prefix = lines[i].match(/^(\s*)/)[1];
        var ts = " {{" + (p.created || todayStr()) + "|r:" + todayStr() + "}}";
        newLines.push(prefix + "- " + p.text + ts);
        continue;
      }
      if (action === "edit") {
        var p = parseTs(stripped.slice(2));
        var prefix = lines[i].match(/^(\s*)/)[1];
        var ts = " {{" + (p.created || todayStr()) + "|r:" + todayStr() + "}}";
        newLines.push(prefix + "- " + newText + ts);
        continue;
      }
    }
    newLines.push(lines[i]);
  }
  var content = newLines.join("\n");
  cached.content = content;
  fetch("/memory", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: cached.id, content: content })
  }).then(function() { fetchBrain(); });
}

  var script = document.createElement("script");
  script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
  script.onload = function() { generatePdf(); };
  if (window.jspdf) { generatePdf(); return; }
  document.head.appendChild(script);
});

function generatePdf() {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: "pt", format: "letter" });
  var pageW = doc.internal.pageSize.getWidth();
  var margin = 50;
  var maxW = pageW - margin * 2;
  var y = 50;
  var lineH = 14;

  function checkPage(needed) {
    if (y + needed > doc.internal.pageSize.getHeight() - 50) {
      doc.addPage();
      y = 50;
    }
  }

  doc.setFont("helvetica", "bold");
  doc.setFontSize(22);
  doc.setTextColor(30, 30, 30);
  doc.text("Cortex — Brain Export", margin, y);
  y += 16;
  doc.setFontSize(9);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(120, 120, 120);
  doc.text(new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }), margin, y);
  y += 30;

  for (var i = 0; i < brainData.files.length; i++) {
    var cluster = brainData.files[i];
    if (!cluster.nodes.length) continue;

    checkPage(40);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.setTextColor(50, 50, 50);
    doc.text(cluster.name.toUpperCase(), margin, y);
    y += 6;
    doc.setDrawColor(200, 200, 200);
    doc.line(margin, y, margin + maxW, y);
    y += 16;

    for (var j = 0; j < cluster.nodes.length; j++) {
      var node = cluster.nodes[j];
      var bullet = node.text;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.setTextColor(40, 40, 40);
      var lines = doc.splitTextToSize("\u2022  " + bullet, maxW - 10);
      checkPage(lines.length * lineH + 4);
      doc.text(lines, margin + 10, y);
      y += lines.length * lineH;

      if (node.importance || node.created) {
        doc.setFontSize(7.5);
        doc.setTextColor(150, 150, 150);
        var meta = [];
        if (node.importance && node.importance !== 3) meta.push("i" + node.importance);
        if (node.source && node.source !== "manual") meta.push(node.source);
        if (node.created) meta.push(node.created);
        if (meta.length) {
          doc.text(meta.join(" · "), margin + 16, y);
          y += 10;
        }
      }
      y += 4;
    }
    y += 12;
  }

  doc.save("cortex-export.pdf");
  toast("pdf exported");
}

var timelineActive = false;
var timelineOverlay = document.getElementById("timelineOverlay");
var tlTooltip = document.createElement("div");
tlTooltip.className = "tl-tooltip";
document.body.appendChild(tlTooltip);
var tlCanvas = null;
var tlCtx = null;
var tlData = null;
var tlHover = -1;

document.getElementById("timelineToggle").addEventListener("click", function() {
  timelineActive = !timelineActive;
  this.classList.toggle("toggle-on", timelineActive);
  if (timelineActive) {
    cv.style.display = "none";

      requestAnimationFrame(function() {

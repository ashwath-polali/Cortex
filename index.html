      });
    });
    buildTimeline();
  } else {
    timelineOverlay.classList.remove("tl-active");
    cv.style.display = "";
    tlTooltip.classList.remove("visible");
  }
});

function buildTimeline() {
  if (!brainData || !brainData.files.length) return;

  timelineOverlay.innerHTML = '<canvas class="tl-canvas" id="tlCanvas"></canvas>';
  tlCanvas = document.getElementById("tlCanvas");
  tlCtx = tlCanvas.getContext("2d");
  tlCanvas.width = window.innerWidth;
  tlCanvas.height = window.innerHeight;

  var clusterOrder = [];
  var clusterColors = {};
  for (var i = 0; i < brainData.files.length; i++) {
    var f = brainData.files[i];
    if (f.nodes.length > 0) {
      clusterOrder.push(f.name);
      clusterColors[f.name] = f.color || null;
    }
  }

  var datedNodes = [];
  var undatedNodes = [];
  for (var i = 0; i < brainData.files.length; i++) {
    var f = brainData.files[i];
    for (var j = 0; j < f.nodes.length; j++) {
      var nd = f.nodes[j];
      var entry = {
        text: nd.text || nd, importance: nd.importance || 3,
        created: nd.created || null, source: nd.source || "manual",
        file: f.name, color: f.color || null
      };
      if (entry.created) datedNodes.push(entry);
      else undatedNodes.push(entry);
    }
  }

  var today = todayStr();
  var minDate = today, maxDate = today;
  for (var i = 0; i < datedNodes.length; i++) {
    if (datedNodes[i].created < minDate) minDate = datedNodes[i].created;
    if (datedNodes[i].created > maxDate) maxDate = datedNodes[i].created;
  }

  var minMs = new Date(minDate + "T00:00:00").getTime();
  var todayMs = new Date(today + "T00:00:00").getTime();
  var spanDays = Math.max(1, Math.round((todayMs - minMs) / 86400000)) + 1;

  var TW = tlCanvas.width;
  var TH = tlCanvas.height;
  var ML = 120, MR = 40, MT = 60, MB = 60;
  var plotW = TW - ML - MR;
  var laneCount = clusterOrder.length;
  var totalLaneH = TH - MT - MB;
  var laneH = Math.min(40, Math.max(18, totalLaneH / Math.max(laneCount, 1)));
  var laneGap = Math.max(2, Math.min(6, (totalLaneH - laneH * laneCount) / Math.max(laneCount - 1, 1)));

  if (laneH * laneCount + laneGap * (laneCount - 1) > totalLaneH) {
    laneH = (totalLaneH - laneGap * (laneCount - 1)) / laneCount;
  }

  var contentH = laneH * laneCount + laneGap * (laneCount - 1);
  var startY = MT + (totalLaneH - contentH) / 2;

  var dots = [];
  var dotR = Math.max(2, Math.min(3.5, plotW / spanDays * 0.35));

  for (var ci = 0; ci < clusterOrder.length; ci++) {
    var cName = clusterOrder[ci];
    var laneTop = startY + ci * (laneH + laneGap);
    var laneMid = laneTop + laneH / 2;
    var clusterNodes = [];

    for (var i = 0; i < datedNodes.length; i++) {
      if (datedNodes[i].file === cName) clusterNodes.push(datedNodes[i]);
    }

    var daySlots = {};
    for (var i = 0; i < clusterNodes.length; i++) {
      var n = clusterNodes[i];
      var nMs = new Date(n.created + "T00:00:00").getTime();
      var dayIdx = Math.round((nMs - minMs) / 86400000);
      var x = ML + (dayIdx + 0.5) / spanDays * plotW;
      if (!daySlots[dayIdx]) daySlots[dayIdx] = [];
      daySlots[dayIdx].push({ node: n, x: x });
    }

    for (var dayIdx in daySlots) {
      var slot = daySlots[dayIdx];
      var count = slot.length;
      var usableH = laneH - dotR * 2;
      var spacing = count > 1 ? Math.min(dotR * 2.4, usableH / (count - 1)) : 0;
      var totalH = (count - 1) * spacing;
      var baseY = laneMid - totalH / 2;

      for (var si = 0; si < slot.length; si++) {
        var s = slot[si];
        var jitterX = (Math.random() - 0.5) * Math.max(1, dotR * 0.8);
        var y = baseY + si * spacing;

        dots.push({
          x: s.x + jitterX, y: y,
          r: (s.node.importance >= 5) ? dotR * 1.3 : (s.node.importance <= 2) ? dotR * 0.7 : dotR,
          color: s.node.color,
          alpha: (s.node.importance >= 5) ? 0.7 : (s.node.importance <= 2) ? 0.3 : 0.5,
          text: s.node.text, file: s.node.file,
          date: s.node.created, source: s.node.source,
          importance: s.node.importance, cluster: ci
        });
      }
    }
  }

  tlData = {
    dots: dots, clusterOrder: clusterOrder, clusterColors: clusterColors,
    minMs: minMs, spanDays: spanDays, today: today,
    ML: ML, MR: MR, MT: MT, MB: MB, plotW: plotW,
    laneH: laneH, laneGap: laneGap, startY: startY,
    datedCount: datedNodes.length,
    TW: TW, TH: TH
  };

  drawTimeline();
  bindTimelineMouse();
}

function drawTimeline() {
  if (!tlData || !tlCtx) return;
  var d = tlData;
  var c = tlCtx;
  c.clearRect(0, 0, d.TW, d.TH);

  var fg = isDark ? "255,255,255" : "0,0,0";

  c.font = "500 11px 'JetBrains Mono', monospace";
  c.fillStyle = "rgba(" + fg + ",0.12)";
  c.textAlign = "center";
  c.fillText("CORTEX / TIMELINE", d.TW / 2, 28);

  for (var ci = 0; ci < d.clusterOrder.length; ci++) {
    var laneTop = d.startY + ci * (d.laneH + d.laneGap);
    c.fillStyle = "rgba(" + fg + ",0.018)";
    c.fillRect(d.ML, laneTop, d.plotW, d.laneH);

    var cc = d.clusterColors[d.clusterOrder[ci]];
    if (cc) {
      c.beginPath();
      c.arc(d.ML - 14, laneTop + d.laneH / 2, 4, 0, Math.PI * 2);
      c.fillStyle = cc;
      c.fill();
    }
    c.font = "400 10px 'JetBrains Mono', monospace";
    c.fillStyle = "rgba(" + fg + ",0.45)";
    c.textAlign = "right";
    c.textBaseline = "middle";
    c.fillText(d.clusterOrder[ci], d.ML - (cc ? 24 : 14), laneTop + d.laneH / 2);
  }

  c.strokeStyle = "rgba(" + fg + ",0.06)";
  c.lineWidth = 1;
  var axisY = d.startY + d.clusterOrder.length * (d.laneH + d.laneGap) - d.laneGap + 8;
  c.beginPath();
  c.moveTo(d.ML, axisY);
  c.lineTo(d.ML + d.plotW, axisY);
  c.stroke();

  var monthNames = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
  var lastMonth = -1;
  c.textAlign = "center";
  c.textBaseline = "top";

  for (var day = 0; day < d.spanDays; day++) {
    var ms = d.minMs + day * 86400000;
    var dt = new Date(ms);
    var x = d.ML + (day + 0.5) / d.spanDays * d.plotW;
    var m = dt.getMonth();
    var dd = dt.getDate();
    var dateStr = dt.getFullYear() + "-" + String(m+1).padStart(2,"0") + "-" + String(dd).padStart(2,"0");
    var isToday = dateStr === d.today;

    var showLabel = false;
    var labelText = "";
    var subText = "";

    if (d.spanDays <= 14) {
      showLabel = true;
      labelText = monthNames[m] + " " + dd;
      subText = isToday ? "today" : "day " + (day + 1);
    } else if (d.spanDays <= 45) {
      if (m !== lastMonth || dd % 3 === 1 || isToday) {
        showLabel = true;
        labelText = m !== lastMonth ? monthNames[m] + " " + dd : String(dd);
        subText = isToday ? "today" : "day " + (day + 1);
      }
    } else if (d.spanDays <= 120) {
      if (m !== lastMonth || dd % 7 === 1 || isToday) {
        showLabel = true;
        labelText = m !== lastMonth ? monthNames[m] + " " + dd : String(dd);
        subText = isToday ? "today" : "";
      }
    } else if (d.spanDays <= 240) {
      if (m !== lastMonth || dd === 15 || isToday) {
        showLabel = true;
        labelText = m !== lastMonth ? monthNames[m].toUpperCase() : dd === 15 ? "15" : "";
        subText = isToday ? "today" : "";
      }
    } else {
      if (m !== lastMonth) {
        showLabel = true;
        labelText = monthNames[m].toUpperCase();
        subText = isToday ? "today" : "";
      } else if (isToday) {
        showLabel = true;
        labelText = dd;
        subText = "today";
      }
    }

    if (m !== lastMonth) lastMonth = m;

    if (showLabel && labelText) {
      c.font = "400 9px 'JetBrains Mono', monospace";
      c.fillStyle = "rgba(" + fg + "," + (isToday ? "0.3" : "0.15") + ")";
      c.fillText(labelText, x, axisY + 6);

      if (subText) {
        c.font = "400 7px 'JetBrains Mono', monospace";
        c.fillStyle = "rgba(" + fg + "," + (isToday ? "0.2" : "0.08") + ")";
        c.fillText(subText, x, axisY + 19);
      }
    }

    if (isToday) {
      c.strokeStyle = "rgba(" + fg + ",0.08)";
      c.lineWidth = 1;
      c.setLineDash([2, 3]);
      c.beginPath();
      c.moveTo(x, d.startY - 6);
      c.lineTo(x, axisY);
      c.stroke();
      c.setLineDash([]);

      c.beginPath();
      c.arc(x, axisY, 2.5, 0, Math.PI * 2);
      c.fillStyle = "rgba(" + fg + ",0.2)";
      c.fill();
    }

    c.strokeStyle = "rgba(" + fg + ",0.03)";
    c.lineWidth = 0.5;
    c.beginPath();
    c.moveTo(x, axisY - 3);
    c.lineTo(x, axisY);
    c.stroke();
  }

  for (var i = 0; i < d.dots.length; i++) {
    var dot = d.dots[i];
    var isHover = (i === tlHover);
    var r = isHover ? dot.r * 2.5 : dot.r;
    var a = isHover ? Math.min(1, dot.alpha + 0.3) : dot.alpha;

    c.beginPath();
    c.arc(dot.x, dot.y, r, 0, Math.PI * 2);

    if (dot.color) {
      var rgb = hexToRgb(dot.color);
      c.fillStyle = "rgba(" + rgb + "," + a + ")";
    } else {
      c.fillStyle = "rgba(" + fg + "," + a + ")";
    }
    c.fill();

    if (isHover) {
      c.beginPath();
      c.arc(dot.x, dot.y, r + 4, 0, Math.PI * 2);
      c.fillStyle = dot.color ? "rgba(" + hexToRgb(dot.color) + ",0.08)" : "rgba(" + fg + ",0.06)";
      c.fill();
    }
  }

  c.font = "400 10px 'JetBrains Mono', monospace";
  c.fillStyle = "rgba(" + fg + ",0.13)";
  c.textAlign = "center";
  c.textBaseline = "bottom";
  c.fillText(d.datedCount + " memories / " + d.spanDays + " days", d.TW / 2, d.TH - 18);
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return r + "," + g + "," + b;
}

function bindTimelineMouse() {
  tlCanvas.addEventListener("mousemove", function(e) {
    if (!tlData) return;
    var best = -1, bestD = 12;
    for (var i = 0; i < tlData.dots.length; i++) {
      var dot = tlData.dots[i];
      var dx = dot.x - e.clientX, dy = dot.y - e.clientY;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestD) { bestD = dist; best = i; }
    }

    if (best !== tlHover) {
      tlHover = best;
      drawTimeline();
    }

    if (best >= 0) {
      var dot = tlData.dots[best];
      var fg = isDark ? "255,255,255" : "0,0,0";
      var srcColor = (dot.source === 'claude' || dot.source === 'claude_code') ? 'rgba(204,108,29,0.7)' : dot.source === 'perplexity' ? 'rgba(120,80,200,0.7)' : 'rgba(' + fg + ',0.35)';

      var h = '<div class="tl-tt-file">' + dot.file + (dot.importance ? ' <span style="opacity:0.5;font-size:8px;">i' + dot.importance + '</span>' : '') + '</div>';
      h += dot.text;
      if (dot.date) h += '<div class="tl-tt-date">' + dot.date + ' — ' + relDate(dot.date) + ' ago</div>';
      else h += '<div class="tl-tt-date">undated</div>';
      if (dot.source) h += '<div class="tl-tt-source" style="color:' + srcColor + ';">' + dot.source + '</div>';
      tlTooltip.innerHTML = h;

      var tx = e.clientX + 14;
      var ty = e.clientY - 10;
      if (tx + 360 > window.innerWidth) tx = e.clientX - 370;
      if (ty < 10) ty = e.clientY + 14;
      tlTooltip.style.left = tx + "px";
      tlTooltip.style.top = ty + "px";
      tlTooltip.classList.add("visible");
    } else {
      tlTooltip.classList.remove("visible");
    }
  });

  tlCanvas.addEventListener("mouseleave", function() {
    tlHover = -1;
    drawTimeline();
    tlTooltip.classList.remove("visible");
  });

  tlCanvas.addEventListener("click", function(e) {
    if (tlHover >= 0 && tlData) {
      openEditor(tlData.dots[tlHover].file + ".md");
    }
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
